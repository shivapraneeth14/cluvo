name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  env-hygiene:
    name: Environment hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-env-hygiene.sh

  build-web:
    name: Flutter web build (explicit defines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - name: Build web with per-branch environment defines
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ github.ref_name == 'main' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_TEST }} \
            --dart-define=SUPABASE_ANON_KEY=${{ github.ref_name == 'main' && secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY_TEST }} \
            --dart-define=CLOUDINARY_CLOUD_NAME=djz0pypu1 \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=cluvo_preset

  test:
    name: Flutter test (define-less, fail-fast guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter test

  detect-secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified
