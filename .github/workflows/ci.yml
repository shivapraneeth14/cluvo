name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  env-hygiene:
    name: Environment hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-env-hygiene.sh

  build-web:
    name: Flutter web build (per-branch defines from file)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - name: Build web with per-branch environment defines
        run: |
          cat > env.ci.json <<EOF
          {
            "SUPABASE_URL": "${{ github.ref_name == 'main' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_TEST }}",
            "SUPABASE_ANON_KEY": "${{ github.ref_name == 'main' && secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY_TEST }}",
            "CLOUDINARY_CLOUD_NAME": "djz0pypu1",
            "CLOUDINARY_UPLOAD_PRESET": "cluvo_preset",
            "RAZORPAY_KEY_ID": "rzp_test_THqWNZqOZGQZOu"
          }
          EOF
          flutter build web --release --dart-define-from-file=env.ci.json

  test:
    name: Flutter test (define-less, fail-fast guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Flutter Android build (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      # Debug build validates the Android manifest, Gradle config, and R8/desugaring
      # wiring without requiring release signing keys (release signing is enforced in
      # build.gradle.kts and intentionally fails without a keystore).
      - run: flutter build apk --debug

  detect-secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified
